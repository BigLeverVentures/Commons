<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Commons sign-in link</title></head>
<body style="margin:0;background:#f8f2e9;color:#0d121d;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;">
  <table role="presentation" style="width:100%;border-collapse:collapse;"><tr><td style="padding:24px;">
    <table role="presentation" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;"><tr><td>
      <h2 style="margin:0 0 20px;font-family:Georgia,serif;font-size:28px;line-height:1.2;">Your Commons sign-in link</h2>
      <p style="margin:0 0 20px;">Use the link below to sign in. This link can only be used once.</p>
      <p style="margin:0 0 24px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="color:#8d5431;text-decoration:underline;">Sign in to Commons</a></p>
      <p style="margin:0 0 20px;">If you did not request this email, you can ignore it.</p>
      <p style="margin:0 0 24px;">For help, contact <a href="mailto:support@example.org" style="color:#8d5431;text-decoration:underline;">support@example.org</a>.</p>
      <hr style="margin:0 0 20px;border:0;border-top:1px solid #e4d8c6;">
      <p style="margin:0;font-size:14px;color:#4d5262;">Built on Commons by <a href="https://github.com/BigLeverVentures/Commons" style="color:#8d5431;text-decoration:underline;">Big Lever Ventures</a>.</p>
    </td></tr></table>
  </td></tr></table>
</body>
</html>
